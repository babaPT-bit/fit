<!doctype html>
<html><head><meta charset="utf-8"><title>Toning Myth</title>
<style>
@font-face { font-family: Caveat; font-weight: 700; src: url(../lib/fonts/caveat-700.woff2); }
html,body{margin:0;background:#fff}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/rough.js"></script>
<script src="../lib/doodle.js"></script>
<script src="voice/lines.js"></script>
<script>window.TIMING = { pre: 0.15, post: 0.3 };</script>
<script src="../lib/doodlekit.js"></script>
<script src="../lib/fixkit.js"></script>
<script src="../lib/studykit.js"></script>
<script>
function barbellUp(m, s) { S.rc.line(m.L.H[0] - 60, m.L.H[1], m.R.H[0] + 60, m.R.H[1], ro({ strokeWidth: 9, stroke: GREY })); for (const p of [[m.L.H[0] - 50, m.L.H[1]], [m.R.H[0] + 50, m.R.H[1]]]) S.rc.rectangle(p[0] - 15, p[1] - 70, 30, 140, ro({ strokeWidth: 4, fill: INK, fillStyle: 'solid' })); }
function pink(p) { S.rc.rectangle(p[0] - 30, p[1] - 10, 60, 20, ro({ strokeWidth: 4, stroke: '#e0559b', fill: 'rgba(224,85,155,0.4)', fillStyle: 'solid' })); }
StudyRun({
  key: /^(size|heavy|light|tone|toning|grows|similar|strength|push)/i,
  hook: [['TONING?', 160]], cite: 'Schoenfeld et al., 2017 (review)',
  scenes: {
    hook: (t, st, c) => {
      const b = bro({ x: 280, y: 1650, s: 400 }, t, speaking('hook1', t), { flex: 0, hands: { L: [-0.35, 2.05], R: [0.35, 2.05] } }); barbellUp(b, 400);
      const g = man({ x: 800, y: 1650, s: 400 }, { face: speaking('hook2', t) ? 'shout' : 'smile', mouth: 0.5, arms: { L: [10, 130 * rep(t, 1.4)], R: [10, 130 * rep(t, 1.4)] } }); pink(g.L.H); pink(g.R.H);
      if (t > SEG.hook1.vo - 0.1) say(300, 640, 420, 'Lift HEAVY for size!', [280, 820], 56);
      if (t > SEG.hook2.vo - 0.1) say(780, 860, 460, 'No, light weights. I just want to tone.', [800, 1000], 50);
    },
    myth: (t, st, c) => { bigText([['TONING', 170, INK]], 900, t, st.s.start); cross(540, 840, 600, 160); label('muscle grows… or it doesn\'t', 540, 1150, RED, 64); },
    study: (t, st, c) => { scientist({ x: 540, y: 950, s: 300 }, t); const a = man({ x: 290, y: 1600, s: 330 }, { arms: { L: [10, 130 * c], R: [10, 130 * c] } }); pink(a.L.H); pink(a.R.H); label('light, close to failure', 290, 1680, RED, 48); const b = man({ x: 790, y: 1600, s: 330 }, { hands: { L: [-0.35, 1.5 + 0.55 * c], R: [0.35, 1.5 + 0.55 * c] } }); barbellUp(b, 330); label('heavy, close to failure', 790, 1680, RED, 48); },
    result: (t, st, c) => { const g = ease(clamp(st.u * 1.6)); bars(330, 1350, [{ label: 'light', v: 0.65 * g, on: true }, { label: 'heavy', v: 0.66 * g, on: true }], 560, 140, 50); bars(780, 1350, [{ label: 'light', v: 0.4 * g }, { label: 'heavy', v: 0.85 * g, on: true }], 560, 140, 50); label('MUSCLE: ≈ same', 330, 1500, RED, 54); label('STRENGTH: heavy wins', 780, 1500, INK, 50); },
    out: (t, st, c) => { sticky(160, 700, 760, 420, -0.02, [['Light = muscle too', 72, RED], ['(push close to failure)', 54], ['Heavy = strength', 72, RED]], fade(st.u, 0.05, 0.2)); mark(true, 540, 1350, 120); },
  },
});
</script></body></html>
