<script>
const armSide = (o, up, fore) => { const sh = [0.02, 1.42], elb = add(sh, pol(-90 + up), 0.3), hand = add(elb, pol(-90 + fore), 0.28); return { ankle: [0.04, 0.07], knee: [0.06, 0.48], hip: [0, 0.92], sh, elb, hand }; };
MoveRun({ ep: 13, next: 'Vertical pull', key: /^(triceps|two-thirds|straightens|elbow|pushdowns|overhead|long|skull|dips|close-grip|heavy)/i,
  hook: [['TRICEPS =', 150], ['2/3 OF YOUR ARM', 120]],
  hookScene: (t, st, c) => { man({ x: 540, y: 1700, s: 500 }, { arms: { L: [80, 95], R: [80, 95] }, flex: 0.5 + 0.3 * c, flexSide: 'LR' }); },
  motionTitle: ['The motion', 'straighten the elbow'],
  motionScene: (t, st, c) => { const o = { x: 330, y: 1700, s: 520 }, J = armSide(o, 4, 110 - 108 * c); sideFig(o, J); S.rc.ellipse(...toS(o, add(J.sh, pol(-95), 0.15)), 40, 0.25 * o.s, ro(hatch(RED, 6))); const o2 = { x: 780, y: 1700, s: 520 }, J2 = armSide(o2, 172, 172 - 160 * (1 - c)); sideFig(o2, J2); dumbbell(toS(o2, J2.hand), 400); label('arm at side', 330, 1780, INK, 50); label('arm overhead', 780, 1780, RED, 50); },
  cards: [{ icon: 'cable', name: 'Pushdown', kw: 'pushdowns', tag: 'outer heads' }, { icon: 'dumbbell', name: 'Overhead ext.', kw: 'overhead', tag: 'long head stretch' }, { icon: 'barbell', name: 'Skull crusher', kw: 'skull', tag: 'in between' }, { icon: 'body', name: 'Dips / CG bench', kw: 'dips', tag: 'go heavy' }],
  take: [['1 overhead move', 76, RED], ['+ 1 pushdown', 76, RED], ['= triceps covered', 60]],
});
