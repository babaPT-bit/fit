<!doctype html>
<html><head><meta charset="utf-8"><title>Rounded Shoulders Fix</title>
<style>
@font-face { font-family: Caveat; font-weight: 700; src: url(../lib/fonts/caveat-700.woff2); }
html,body{margin:0;background:#fff}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/rough.js"></script>
<script src="../lib/doodle.js"></script>
<script src="voice/lines.js"></script>
<script>window.TIMING = { pre: 0.15, post: 0.3 };</script>
<script src="../lib/doodlekit.js"></script>
<script src="../lib/fixkit.js"></script>
<script>
// side-view standing posture; sl 0 upright .. 1 slouched (head and shoulders forward)
function postureJ(sl, phone) {
  const ankle = [0, 0.07], knee = [0.02, 0.5], hip = [0, 0.92], sh = [0.07 * sl, 1.4 - 0.03 * sl];
  const head = add(sh, pol(90 - 38 * sl), 0.21);
  const elb = add(sh, pol(-80), 0.3), hand = phone ? add(elb, pol(40), 0.26) : add(elb, pol(-88), 0.28);
  return { ankle, knee, hip, sh, head, elb, hand };
}
function plumb(o) { ctx.save(); ctx.setLineDash([12, 10]); ctx.strokeStyle = 'rgba(31,138,59,0.7)'; ctx.lineWidth = 4; const a = toS(o, [0.02, 0]), b = toS(o, [0.02, 1.95]); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.restore(); }
FixRun({
  key: /^(rounding|shoulders|forward|chest|tight|upper|weak|screen|eye|pulling|pull-aparts|stretch)/i, physio: false,
  hook: [['ROUNDED', 160], ['SHOULDERS?', 150]],
  titles: { cause: ['The cause', 'tight chest, weak upper back'], step1: ['Step 1: fix your setup', 'screen up, pull more'], step2: ['Step 2: still rounding?', 'every day, 2 minutes'], out: ['Stand tall', null] },
  scenes: {
    hook: (t, st, c) => { const o = { x: 480, y: 1700, s: 560 }; plumb(o); const f = sideFig(o, postureJ(1, true), { mood: 'sad', lookDeg: -30 }); S.rc.rectangle(f.hand[0] - 20, f.hand[1] - 50, 40, 70, ro({ strokeWidth: 4, fill: INK, fillStyle: 'solid' })); arrow(f.sh[0] - 80, f.sh[1] - 40, f.sh[0] + 10, f.sh[1] + 10); },
    cause: (t, st, c) => {
      const o = { x: 420, y: 1700, s: 560 }; plumb(o); const f = sideFig(o, postureJ(1, false), { mood: 'sad' });
      S.rc.ellipse(f.sh[0] + 45, f.sh[1] + 70, 60, 120, ro(hatch(RED, 6))); label('chest: tight', f.sh[0] + 250, f.sh[1] + 60, RED, 58);
      S.rc.ellipse(f.sh[0] - 50, f.sh[1] + 70, 60, 120, ro(pencil())); label('upper back: weak', f.sh[0] - 170, f.sh[1] + 260, INK, 58);
    },
    step1: (t, st, c) => {
      const o = { x: 380, y: 1700, s: 560 }; plumb(o); sideFig(o, postureJ(0, false));
      S.rc.rectangle(620, 820, 230, 150, ro({ strokeWidth: 6 })); S.rc.line(735, 970, 735, 1600, ro({ strokeWidth: 6, stroke: GREY })); label('eye level', 735, 800, GREEN, 54);
      sticky(640, 1080, 360, 250, 0.04, [['PULL  >  PUSH', 60, RED], ['rows, pull-ups', 48], ['vs presses', 48]], fade(st.u, 0.3, 0.45)); mark(true, 900, 470, 100);
    },
    step2: (t, st, c) => {
      const o1 = { x: 300, y: 1200, s: 380 }, w = 0.1 + 0.45 * c, m = man(o1, { hands: { L: [-w, 1.42], R: [w, 1.42] } });
      S.rc.line(...m.L.H, ...m.R.H, ro({ stroke: RED, strokeWidth: 6, roughness: 0.6 })); label('band pull-apart', 300, 1270, RED, 56);
      const o2 = { x: 760, y: 1650, s: 380 }; S.rc.rectangle(o2.x - 0.55 * o2.s, o2.y - 2.1 * o2.s, 1.1 * o2.s, 2.1 * o2.s, ro({ strokeWidth: 8, stroke: GREY }));
      man(o2, { arms: { L: [90, 90], R: [90, 90] } }); S.rc.ellipse(o2.x, o2.y - 1.3 * o2.s, 0.3 * o2.s, 0.14 * o2.s, ro(hatch(RED, 6))); label('doorway chest stretch', 760, 1720, RED, 52);
    },
    out: (t, st, c) => { const o = { x: 480, y: 1650, s: 520 }; plumb(o); sideFig(o, postureJ(0, false)); mark(true, 860, 900, 120); },
  },
});
</script></body></html>
