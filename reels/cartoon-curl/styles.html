<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1080, H = 1920;
const style = new URLSearchParams(location.search).get('style') || 'anime';
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const lerp = (a, b, u) => a + (b - a) * u;

// tapered limb with round ends

// curl arm geometry: shoulder S, upper arm down-forward, forearm rotates forward/up with contraction c

// =====================================================================

function hoseOverlay(t) {
  // sepia film: grain, scratches, flicker, round vignette
  const r = rng(3 + Math.floor(t * 24)), img = ctx.getImageData(0, 0, W, H), d = img.data;
  const flick = 1 + (r() - 0.5) * 0.06;
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * 34;
    const y = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
    const keepRed = d[i] > d[i + 1] + 60;                        // keep the red muscle tint
    if (!keepRed) { d[i] = (y * 1.07 + n) * flick; d[i + 1] = (y * 0.98 + n) * flick; d[i + 2] = (y * 0.84 + n) * flick; }
    else { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  }
  ctx.putImageData(img, 0, 0);
  ctx.strokeStyle = 'rgba(30,25,20,0.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) { const x = r() * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (r() - 0.5) * 30, H); ctx.stroke(); }
  for (let i = 0; i < 8; i++) { ctx.fillStyle = 'rgba(20,15,10,0.5)'; ctx.beginPath(); ctx.arc(r() * W, r() * H, 1 + r() * 3, 0, 7); ctx.fill(); }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.62); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,8,5,0.85)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.drawFrame = function (t, c = 1) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (style === 'anime') {
    animeBackground(); animeCharacter(c); animeOverlay();
    ctx.font = '400 64px "Patrick Hand"'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 12; ctx.fillText('Arm in front hits the short head', W / 2, 1790); ctx.shadowColor = 'transparent';
  } else {

    ctx.fillStyle = PAPER; ctx.fillRect(90, 1680, 900, 130); ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.strokeRect(90, 1680, 900, 130); ctx.lineWidth = 3; ctx.strokeRect(104, 1694, 872, 102);
    ctx.font = 'bold italic 44px "DejaVu Serif"'; ctx.textAlign = 'center'; ctx.fillStyle = INK; ctx.fillText('Arm in front hits the short head', W / 2, 1764);
    hoseOverlay(t);
  }
  return cv.toDataURL('image/png');
};
