<!doctype html>
<html><head><meta charset="utf-8"><title>Wrist Pain Fix</title>
<style>
@font-face { font-family: Caveat; font-weight: 700; src: url(../lib/fonts/caveat-700.woff2); }
html,body{margin:0;background:#fff}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/rough.js"></script>
<script src="../lib/doodle.js"></script>
<script src="voice/lines.js"></script>
<script>window.TIMING = { pre: 0.15, post: 0.3 };</script>
<script src="../lib/doodlekit.js"></script>
<script src="../lib/fixkit.js"></script>
<script>
// close-up: forearm going down to the elbow, hand on top, bar circle
function wristClose(cx, cy, k, bent, t) {
  const el = [cx, cy + 340 * k], wr = [cx, cy];
  const ha = bent ? 125 : 90, hand = [wr[0] + Math.cos(rad(ha)) * 170 * k, wr[1] - Math.sin(rad(ha)) * 170 * k];
  S.rc.line(...el, ...wr, ro({ strokeWidth: 30 * k + 6 }));
  S.rc.line(...wr, ...hand, ro({ strokeWidth: 26 * k + 6 }));
  S.rc.circle(...el, 50 * k, ro({ fill: '#f4f1ea', fillStyle: 'solid' })); label('elbow', el[0] + 70 * k, el[1] + 10, INK, 46, 'left');
  const bar = bent ? hand : [wr[0], wr[1] - 40 * k];
  S.rc.circle(...bar, 90 * k, ro({ strokeWidth: 6, stroke: GREY, fill: 'rgba(74,74,74,0.5)', fillStyle: 'solid' }));
  if (bent) { ctx.strokeStyle = RED; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(wr[0], wr[1], 90 * k, -Math.PI / 2 - rad(35), -Math.PI / 2); ctx.stroke(); spark(wr[0] + 30, wr[1] + 10, t || 0, 55); }
  else { ctx.save(); ctx.setLineDash([12, 10]); ctx.strokeStyle = GREEN; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx, bar[1] - 80 * k); ctx.lineTo(cx, el[1] + 60 * k); ctx.stroke(); ctx.restore(); }
}
// wrist curl on a bench: forearm on the thigh, hand curls the dumbbell
function wristCurl(o, c, reverse) {
  S.rc.rectangle(...toS(o, [-0.5, 0.5]), 0.9 * o.s, 0.06 * o.s, ro({ strokeWidth: 5, stroke: GREY }));
  const el = toS(o, [-0.3, 0.58]), wr = toS(o, [0.08, 0.58]);
  S.rc.line(...el, ...wr, ro({ strokeWidth: 12 }));
  const a = reverse ? -40 + 70 * c : 40 - 80 * (1 - c), h = [wr[0] + Math.cos(rad(a)) * 0.13 * o.s, wr[1] - Math.sin(rad(a)) * 0.13 * o.s];
  S.rc.line(...wr, ...h, ro({ strokeWidth: 10 })); dumbbell(h, o.s * 0.9, Math.PI / 2);
  S.rc.ellipse((el[0] + wr[0]) / 2, (el[1] + wr[1]) / 2 - 10, 0.3 * o.s, 0.06 * o.s, ro(hatch(RED, 6)));
}
FixRun({
  key: /^(wrists|wrist|bending|joint|heel|palm|stack|elbow|curls|forearms)/i,
  hook: [['WRIST', 160], ['PAIN?', 160]],
  titles: { cause: ['The cause', 'wrist bent back'], step1: ['Step 1: check form', 'heel of palm, wrist stacked'], step2: ['Step 2: still sore?', 'strengthen your forearms'], out: ['Stack it', null] },
  scenes: {
    hook: (t, st, c) => { benchTop({ x: 540, y: 880, s: 400 }, 45, c); wristClose(540, 1380, 0.75, true, t); },
    cause: (t, st, c) => { zoom(540, 960, 430, 1, (cx, cy) => wristClose(cx, cy, 1, true, t)); mark(false, 900, 1450, 110); label('weight hangs on the joint', 540, 1500, RED, 58); },
    step1: (t, st, c) => { zoom(540, 960, 430, 1, (cx, cy) => wristClose(cx, cy, 1, false)); mark(true, 900, 1450, 110); label('heel of palm', 760, 820, GREEN, 58); label('wrist over elbow', 540, 1500, GREEN, 58); },
    step2: (t, st, c) => {
      wristCurl({ x: 560, y: 1050, s: 700 }, c, false); label('wrist curl (palms up)', 540, 1120, RED, 58);
      wristCurl({ x: 560, y: 1620, s: 700 }, c, true); label('reverse wrist curl (palms down)', 540, 1690, RED, 52);
    },
    out: (t, st, c) => { zoom(540, 940, 400, 0.95, (cx, cy) => wristClose(cx, cy, 1, false)); mark(true, 900, 1450, 120); },
  },
});
</script></body></html>
