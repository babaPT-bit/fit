<!doctype html>
<html><head><meta charset="utf-8"><title>Calves Reel</title>
<style>
@font-face { font-family: Caveat; font-weight: 700; src: url(../lib/fonts/caveat-700.woff2); }
html,body{margin:0;background:#fff}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/rough.js"></script>
<script src="../lib/doodle.js"></script>
<script src="voice/lines.js"></script>
<script>window.TIMING = { pre: 0.15, post: 0.3 };</script>
<script src="../lib/doodlekit.js"></script>
<script>
const KEY = /^(stubborn|skinny|bounce|half|achilles|tendon|stretch|pause|bottom|straight|bent|gastrocnemius|soleus|slow|failure)/i;
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const pol = (deg, k = 1) => [Math.cos(rad(deg)) * k, Math.sin(rad(deg)) * k];
const toS = (o, p) => [o.x + p[0] * o.s, o.y - p[1] * o.s];
const STEP = 0.18;

// standing calf raise on a step, facing right. ang: foot angle (- = heel below the step, + = up on toes)
function standJ(ang, kneeBend = 0) {
  const toe = [0.12, STEP];
  const ankle = add(toe, pol(180 + ang), 0.17);                  // heel side of the foot pivots around the toes
  const knee = add(ankle, pol(90 - kneeBend), 0.45), hip = add(knee, pol(90 + kneeBend), 0.45);
  const sh = add(hip, pol(90), 0.52), elb = add(sh, pol(-80), 0.3), hand = add(elb, pol(-85), 0.28);
  return { toe, ankle, knee, hip, sh, elb, hand };
}
// seated calf raise: knees bent 90°, pad on the knees
function seatJ(ang) {
  const toe = [0.12, STEP], ankle = add(toe, pol(180 + ang), 0.17);
  const knee = add(ankle, pol(90), 0.45), hip = add(knee, pol(180), 0.45);
  const sh = add(hip, pol(90), 0.52), elb = add(sh, pol(-50), 0.25), hand = knee;
  return { toe, ankle, knee, hip, sh, elb, hand };
}
function step(o) { S.rc.rectangle(...toS(o, [-0.05, STEP]), 0.3 * o.s, STEP * o.s, ro({ strokeWidth: 5, stroke: '#4a4a4a', fill: 'rgba(74,74,74,0.15)', fillStyle: 'solid' })); }
function calfBlob(o, J, on, wide = 1) {
  const a = toS(o, J.ankle), k = toS(o, J.knee), m = [a[0] + (k[0] - a[0]) * 0.62, a[1] + (k[1] - a[1]) * 0.62];
  const ang = Math.atan2(k[1] - a[1], k[0] - a[0]);
  ctx.save(); ctx.translate(...m); ctx.rotate(ang);
  S.rc.ellipse(0, -12 * wide, 0.3 * o.s, 0.09 * o.s * wide, ro(on ? hatch(RED, 7) : pencil()));
  ctx.restore();
}
function spring(o, J) {
  const a = toS(o, J.ankle), b = toS(o, add(J.ankle, add(J.knee, J.ankle, -1), 0.3)), pts = [];
  for (let i = 0; i <= 8; i++) { const u = i / 8; pts.push([a[0] + (b[0] - a[0]) * u - 22 + (i % 2 ? 26 : 0), a[1] + (b[1] - a[1]) * u]); }
  S.rc.linearPath(pts, ro({ stroke: RED, strokeWidth: 6, roughness: 0.4 }));
}
// lower leg from behind: gastrocnemius (two bellies, top) over the soleus (underneath), Achilles at the bottom
function legMap(cx, cy, which) {
  const g = which === 'gastroc', so = which === 'soleus';
  S.rc.ellipse(cx, cy + 40, 230, 470, ro(so ? hatch(RED, 9) : pencil()));
  for (const sd of [-1, 1]) S.rc.ellipse(cx + sd * 50, cy - 70, 110, 280, ro(g ? hatch(RED, 8) : pencil()));
  S.rc.line(cx, cy + 270, cx, cy + 380, ro({ strokeWidth: 8 }));
  ctx.font = '700 62px Caveat'; ctx.textAlign = 'center';
  ctx.fillStyle = g ? RED : INK; ctx.fillText('gastrocnemius', cx, cy - 250);
  ctx.fillStyle = so ? RED : INK; ctx.fillText('soleus', cx + 190, cy + 230);
}
function mapLens(cx, cy, r, which) {
  lens(cx, cy, r); ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r - 4, 0, 7); ctx.clip();
  ctx.translate(cx, cy); ctx.scale(0.5, 0.5); ctx.translate(-cx, -cy); legMap(cx, cy, which); ctx.restore(); lensRing(cx, cy, r);
}
function fullRep(t, period = 3.2) {           // slow rep with a 2 s pause at the bottom stretch
  const r = ((t % period) + period) % period;
  if (r < 0.6) return -28 + 58 * ease(r / 0.6);       // up
  if (r < 1.2) return 30 - 58 * ease((r - 0.6) / 0.6); // down
  return -28;                                          // pause in the stretch
}

window.drawFrame = function (t) {
  begin(t);
  const { id, s, u, lt } = segAt(t);
  if (id === 'hook') {
    const shiver = 6 * Math.sin(t * 40);
    const o1 = { x: 330 + shiver, y: 1640, s: 470 }, o2 = { x: 760, y: 1640, s: 470 };
    man(o1, { face: 'sad', arms: { L: [20, -30], R: [20, -30] } });
    for (const sd of [-1, 1]) S.rc.line(o1.x + sd * 60, 1250, o1.x + sd * 80, 1220, ro({ stroke: SOFT, strokeWidth: 4 }));    // shiver lines
    man(o2, { arms: { L: [80, 100], R: [80, 100] } });
    for (const sd of [-1, 1]) S.rc.ellipse(o2.x + sd * 0.11 * o2.s, o2.y - 0.3 * o2.s, 0.13 * o2.s, 0.25 * o2.s, ro(hatch(RED, 7)));
    ctx.font = '700 56px Caveat'; ctx.textAlign = 'center'; ctx.fillStyle = INK; ctx.fillText('you', o1.x, 1720); ctx.fillStyle = RED; ctx.fillText('goal', o2.x, 1720);
    bigHook([['STILL', 150], ['SKINNY CALVES?', 130]], s.start, t, 280);
  } else if (id === 'mistake') {
    heading('Tiny bouncy reps', 'tendon does the work');
    const o = { x: 420, y: 1660, s: 580 }, J = standJ(4 + 10 * rep(t, 0.45));
    step(o); const f = sideFig(o, J); calfBlob(o, J, false); spring(o, J);
    ctx.font = '700 60px Caveat'; ctx.fillStyle = RED; ctx.textAlign = 'left'; ctx.fillText('← Achilles "spring"', 520, 1480);
    mark(false, 860, 800, 120);
  } else if (id === 'fix1') {
    heading('Full range + pause', '2 sec in the stretch');
    const o = { x: 420, y: 1660, s: 580 }, ang = fullRep(t - s.start), J = standJ(ang);
    step(o); sideFig(o, J); calfBlob(o, J, true);
    const r = ((t - s.start) % 3.2);
    if (r >= 1.2) { ctx.font = '700 90px Caveat'; ctx.fillStyle = RED; ctx.textAlign = 'center'; ctx.fillText(Math.min(2, Math.floor(r - 1.2) + 1) + '…', 800, 1350); }
    mapLens(820, 700, 220, 'gastroc');
  } else if (id === 'fix2') {
    heading('Do both', null);
    const ang = fullRep(t - s.start);
    const o1 = { x: 230, y: 1650, s: 400 }, J1 = standJ(ang); step(o1); sideFig(o1, J1); calfBlob(o1, J1, true);
    const o2 = { x: 720, y: 1650, s: 400 }, J2 = seatJ(ang); step(o2);
    S.rc.rectangle(...toS(o2, [-0.5, 0.62]), 0.35 * o2.s, 0.06 * o2.s, ro({ strokeWidth: 5, stroke: '#4a4a4a' }));   // seat
    sideFig(o2, J2); calfBlob(o2, J2, true, 1.2);
    S.rc.rectangle(...toS(o2, add(J2.knee, [-0.12, 0.1])), 0.24 * o2.s, 0.06 * o2.s, ro({ strokeWidth: 5, stroke: '#4a4a4a', fill: '#4a4a4a', fillStyle: 'solid' }));  // knee pad
    mapLens(260, 480, 175, 'gastroc'); mapLens(790, 480, 175, 'soleus');
    ctx.font = '700 58px Caveat'; ctx.textAlign = 'center'; ctx.fillStyle = RED;
    ctx.fillText('knees straight', 260, 720); ctx.fillText('knees bent', 790, 720);
  } else {
    heading('The calf plan', null);
    sticky(160, 330, 760, 560, -0.02, [['10–20 slow reps', 78, RED], ['close to failure', 70], ['pause 2 sec at the bottom', 62], ['2–3 times a week', 70]], fade(u, 0.05, 0.2));
    const o2 = { x: 540, y: 1660, s: 430 };
    man(o2, { arms: { L: [80, 100], R: [80, 100] } });
    const g = 0.7 + 0.3 * ease(u);
    for (const sd of [-1, 1]) S.rc.ellipse(o2.x + sd * 0.11 * o2.s, o2.y - 0.3 * o2.s, 0.12 * o2.s * g, 0.24 * o2.s, ro(hatch(RED, 7)));
    if (u > 0.55) saveStamp(860, 1100);
  }
  if (id !== 'hook') flash(lt);
  caption(t, KEY);
  return cv.toDataURL('image/png');
};
fontsReady();
</script></body></html>
