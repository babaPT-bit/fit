<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/rough.js"></script>
<script src="../lib/doodle.js"></script>

<script>window.TIMING = { pre: 0.15, post: 0.3 };</script>

<script src="../lib/studykit.js"></script>
<script src="../lib/supkit.js"></script>
<script>
function row(i, name, col, pros, on) { const y = 620 + i * 300; ctx.globalAlpha = on ? 1 : 0.35; tub(220, y + 60, 0.75, name, col); pros.forEach((p, j) => label(p, 420, y + j * 62, j === 0 ? col : INK, j === 0 ? 62 : 52, 'left')); ctx.globalAlpha = 1; }
SupRun({ ep: '6/11', speaker: 'bro', verdict: 'info', key: /^(whey|plant|yeast|scam|research|fast|blends|vegans|lactose-intolerant|newest|daily|total|one|point|six)/i,
  hook: [['WHEY OR', 150], ['NOTHING?', 160]], bubble: 'Whey is the ONLY real protein. Everything else is a SCAM!', hookProp: ['tub', 'WHEY', RED],
  what: { title: ['Side by side', null], extra: () => { row(0, 'WHEY', RED, ['most research', 'digests fast'], true); row(1, 'PLANT', GREEN, ['almost as good', 'vegan, no lactose'], false); row(2, 'YEAST', '#d9822b', ['newest', 'least research'], false); } },
  help: { title: ['Side by side', null], extra: () => { row(0, 'WHEY', RED, ['most research', 'digests fast'], true); row(1, 'PLANT', GREEN, ['almost as good', 'vegan, no lactose'], true); row(2, 'YEAST', '#d9822b', ['newest', 'least research'], false); } },
  how: { title: ['Side by side', null], extra: () => { row(0, 'WHEY', RED, ['most research', 'digests fast'], true); row(1, 'PLANT', GREEN, ['almost as good', 'vegan, no lactose'], true); row(2, 'YEAST', '#d9822b', ['newest', 'least research'], true); } },
  out: { title: ['What matters most', null], extra: () => notes([['DAILY TOTAL', 76, RED], ['~1.6 g per kg body weight', 58]], 1, 1150) },
});
</script></body></html>
