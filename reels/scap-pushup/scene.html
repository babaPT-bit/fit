<!doctype html>
<html><head><meta charset="utf-8"><title>Scapular Push-up Reel</title>
<style>html,body{margin:0;background:#07090e}canvas{display:block}#gl{position:absolute;left:-99999px}</style></head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="voice/lines.js"></script>
<script type="module">
import { THREE, W, H, createStage, Athlete, buildTimeline, segAt, applyShot, makeChunks, drawCaption, clamp, ease, fade, lerp } from '../lib/studio.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const { renderer, scene, camera } = createStage();
renderer.domElement.id = 'gl'; document.body.appendChild(renderer.domElement);
const out = document.getElementById('out').getContext('2d');
const A = new Athlete(scene);
const TL = buildTimeline(window.VOICE);
window.DURATION = TL.duration; window.VO_TIMES = TL.times;
const CH = makeChunks(window.VOICE, TL);

// exercise mat
const mat = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.012, 0.75), new THREE.MeshStandardMaterial({ color: 0x2a3550, roughness: 0.9 }));
mat.position.set(-0.55, 0.006, 0); mat.receiveShadow = true; scene.add(mat);

// pose: scapular push-up (pr: 0 sink, 1 push) or full push-up (depth 0..1)
const ANK = V(-1.28, 0.09, 0);
function plank(pr, depth = 0, breathe = 0) {
  const S = V(0.0 - 0.06 * depth, 0.615 - 0.33 * depth, 0);
  const up = S.clone().sub(ANK).normalize();
  const fwd = V(up.y, -up.x, 0); // chest faces the floor
  const zl = -0.02 + 0.05 * (pr - 0.5);
  const pelvis = S.clone().addScaledVector(up, -0.47).addScaledVector(fwd, -zl);
  const hip = pelvis.clone().addScaledVector(up, -0.02);
  const ank = hip.clone().addScaledVector(up, -0.86);
  A.set({ pelvis, up, fwd, protract: pr, elevate: 0, breathe,
    hands: [V(0.02, 0.055, 0.235), V(0.02, 0.055, -0.235)], elbowPole: V(-1, 0.2, 0), handDir: V(1, 0, 0),
    ankles: [ank.clone().add(V(0, 0, 0.1)), ank.clone().add(V(0, 0, -0.1))], kneePole: fwd.clone().negate(), toeDir: fwd, headTilt: 0.15 });
}
// reps: smooth 0 -> 1 -> 0
function cycle(t, period) { const r = ((t % period) + period) % period / period; return 0.5 - 0.5 * Math.cos(r * Math.PI * 2); }

const SHOTS = {
  hook:   { from: { pos: [2.0, 1.25, 2.5], target: [-0.45, 0.28, 0], fov: 50 }, to: { pos: [1.5, 0.95, 1.95], target: [-0.4, 0.3, 0] } },
  muscle: { from: { pos: [0.45, 0.32, 1.6], target: [-0.15, 0.45, 0.08], fov: 46 }, to: { pos: [0.25, 0.36, 1.3], target: [-0.15, 0.46, 0.08] } },
  use:    { from: { pos: [-1.35, 2.3, 0.45], target: [-0.12, 0.58, 0], fov: 46 }, to: { pos: [-1.05, 2.05, 1.15], target: [-0.12, 0.56, 0] } },
  how1:   { from: { pos: [-0.35, 0.55, 3.4], target: [-0.4, 0.38, 0], fov: 46 }, to: { pos: [-0.3, 0.6, 3.1], target: [-0.4, 0.38, 0] } },
  how2:   { from: { pos: [0.75, 0.8, 1.95], target: [-0.18, 0.5, 0], fov: 46 }, to: { pos: [0.5, 0.75, 1.6], target: [-0.18, 0.5, 0] } },
  result: { from: { pos: [-1.7, 1.35, 1.9], target: [-0.35, 0.38, 0], fov: 50 }, to: { pos: [1.7, 0.95, 2.1], target: [-0.35, 0.36, 0] } },
  outro:  { from: { pos: [2.4, 0.55, 1.0], target: [-0.3, 0.38, 0], fov: 48 }, to: { pos: [2.2, 0.62, 1.4], target: [-0.3, 0.38, 0] } },
};

function colorFor(w) {
  const s = w.toLowerCase().replace(/[^a-z]/g, '');
  if (['serratus', 'anterior', 'ribs', 'blades', 'blade', 'winging'].includes(s)) return '#ff7a59';
  if (['ten', 'thirty', 'days', 'every', 'day'].includes(s)) return '#8fb4ff';
  if (['healthy', 'steadier', 'stronger', 'safer', 'flat'].includes(s)) return '#34d399';
  return '#ffffff';
}

window.drawFrame = (t) => {
  const { id, u, s } = segAt(TL, t);
  let pr, depth = 0, g = 0;
  if (id === 'how2') { pr = cycle(t - s.start, 3.4); }
  else if (id === 'how1') { pr = 0.5; }
  else if (id === 'result') { depth = cycle(t - s.start, 2.4) ; pr = 1 - depth * 0.7; }
  else pr = cycle(t, 2.4);
  plank(pr, depth, 0.5 + 0.5 * Math.sin(t * 2.2));
  const work = 0.25 + 0.75 * pr;
  g = { hook: 0.6 * work, muscle: work, use: 0.8 * work, how1: 0.3, how2: work, result: 0.6 + 0.4 * work, outro: 0.5 * work }[id];
  A.glow({ serratus: g, scap: id === 'use' || id === 'how2' ? 0.6 * work : 0.1 * g });
  applyShot(camera, SHOTS[id], u);
  // soft cut: brief dip at each segment change
  renderer.render(scene, camera);
  out.drawImage(renderer.domElement, 0, 0);
  const dip = 1 - Math.min(fade(t, s.start, s.start + 0.18), t < 0.2 ? 1 : 1);
  if (dip > 0 && t > 0.3) { out.fillStyle = `rgba(7,9,14,${dip})`; out.fillRect(0, 0, W, H); }
  // vignette
  const vg = out.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H * 0.5, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)'); out.fillStyle = vg; out.fillRect(0, 0, W, H);
  drawCaption(out, CH, t, colorFor);
  return document.getElementById('out').toDataURL('image/png');
};
window.ready = true;
</script>
</body></html>
