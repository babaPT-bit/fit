<!doctype html>
<html><head><meta charset="utf-8"><title>Biceps Heads Reel</title>
<style>
@font-face { font-family: Caveat; font-weight: 700; src: url(../lib/fonts/caveat-700.woff2); }
@font-face { font-family: "Patrick Hand"; src: url(../lib/fonts/patrick-hand.woff2); }
html,body{margin:0;background:#fff}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/rough.js"></script>
<script src="../lib/doodle.js"></script>
<script src="voice/lines.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const D = window.Doodle, W = 1080, H = 1920;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const fade = (t, a, b) => clamp((t - a) / (b - a));

// ---------- voice-driven timeline ----------
const VO = window.VOICE; const SEG = {}; let tc = 0;
for (const ln of VO) { SEG[ln.id] = { start: tc, vo: tc + 0.12, end: tc + 0.12 + ln.dur + 0.18, line: ln }; tc = SEG[ln.id].end; }
window.DURATION = tc + 0.4; window.VO_TIMES = VO.map(ln => ({ file: ln.file, at: SEG[ln.id].vo }));
function segAt(t) { let id = VO[0].id; for (const ln of VO) if (t >= SEG[ln.id].start) id = ln.id; const s = SEG[id]; return { id, s, u: clamp((t - s.start) / (s.end - s.start)) }; }
// curl reps: 0 = arm down, 1 = full contraction
const rep = (t, period = 2.2) => 0.5 - 0.5 * Math.cos(2 * Math.PI * t / period);

// Hand-drawn upper arm (front view, right arm, torso on the left) with the biceps split into
// short head (inner side, toward the chest) and long head (outer side).
function armCloseup(K, cx, cy, s, focus, pulse) {
  const P = (x, y) => [cx + x * s, cy + y * s];
  const tp = K.tp, rc = K.rc;
  const o = (e = {}) => Object.assign({ stroke: tp.ink, strokeWidth: 6, roughness: 1.3, bowing: 1, seed: K.seed }, e);
  const curve = (pts, e) => rc.curve(pts.map(p => P(...p)), o(e));
  curve([[-390, -230], [-250, -250], [-150, -250]], { strokeWidth: 5 });
  curve([[-150, -250], [-120, -330], [-20, -390], [110, -380], [175, -320], [195, -200]], { strokeWidth: 7 });
  curve([[195, -200], [185, -60], [160, 100], [140, 250], [150, 360]], { strokeWidth: 7 });
  curve([[-150, -250], [-125, -90], [-105, 100], [-75, 250], [-60, 360]], { strokeWidth: 7 });
  rc.circle(...P(60, -300), 120 * s, o({ strokeWidth: 3, strokeLineDash: [10, 10], stroke: tp.inkSoft }));
  const shortHead = [[-40, -230], [-95, -120], [-95, 40], [-45, 180], [30, 220], [22, 40], [18, -120], [-40, -230]];
  const longHead  = [[60, -230], [125, -150], [150, 0], [120, 150], [30, 220], [22, 40], [18, -120], [60, -230]];
  const red = tp.muscle, grey = 'rgba(26,26,26,0.28)';
  const fillOn = { stroke: red, strokeWidth: 6, fill: red, fillStyle: 'hachure', hachureGap: 9, fillWeight: 3.2, hachureAngle: -50 };
  const fillOff = { stroke: tp.ink, strokeWidth: 5, fill: grey, fillStyle: 'hachure', hachureGap: 16, fillWeight: 1.5, hachureAngle: 40 };
  const on = focus === 'short' ? shortHead : longHead, off = focus === 'short' ? longHead : shortHead;
  const c = P(focus === 'short' ? -35 : 85, -10);
  const g = ctx.createRadialGradient(...c, 10, ...c, 260 * s);
  g.addColorStop(0, `rgba(215,38,30,${0.22 + 0.18 * pulse})`); g.addColorStop(1, 'rgba(215,38,30,0)');
  ctx.fillStyle = g; ctx.fillRect(c[0] - 300, c[1] - 300, 600, 600);
  rc.polygon(off.map(p => P(...p)), o(fillOff));
  rc.polygon(on.map(p => P(...p)), o(fillOn));
  curve([[50, -235], [18, -120], [22, 40], [30, 220]], { strokeWidth: 6 });
  curve([[60, -230], [95, -300], [60, -365], [-5, -350]], { strokeWidth: focus === 'long' ? 6 : 4, stroke: focus === 'long' ? red : tp.ink });
  curve([[-40, -230], [-70, -290], [-95, -325]], { strokeWidth: focus === 'short' ? 6 : 4, stroke: focus === 'short' ? red : tp.ink });
  rc.circle(...P(-100, -330), 16 * s, o({ fill: tp.ink, fillStyle: 'solid', strokeWidth: 2 }));
  curve([[30, 220], [35, 290], [45, 360]], { strokeWidth: 5 });
  curve([[-60, 360], [40, 330], [150, 360]], { strokeWidth: 5, stroke: tp.inkSoft });
  ctx.save(); ctx.globalAlpha = 0.9;
  const fib = focus === 'short' ? [[-60, -150, -55, 120], [-25, -170, -10, 170]] : [[70, -170, 95, 130], [110, -110, 115, 90]];
  for (const [x0, y0, x1, y1] of fib) curve([[x0, y0], [(x0 + x1) / 2 + 12, (y0 + y1) / 2], [x1, y1]], { stroke: '#7a0f0a', strokeWidth: 3 });
  ctx.restore();
  return { shortAt: P(-70, 0), longAt: P(135, -40), shoulder: P(60, -300) };
}
function magnifier(K, cx, cy, r, from) {
  const rc = K.rc, tp = K.tp;
  const [fx, fy, fr] = from;
  const ang = Math.atan2(cy - fy, cx - fx), perp = ang + Math.PI / 2;
  for (const sgn of [-1, 1]) rc.line(fx + Math.cos(perp) * fr * sgn, fy + Math.sin(perp) * fr * sgn, cx + Math.cos(perp) * r * sgn, cy + Math.sin(perp) * r * sgn,
    { stroke: tp.inkSoft, strokeWidth: 3, roughness: 1.2, seed: K.seed });
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = '#fbf9f3'; ctx.fill(); ctx.restore();
  rc.circle(fx, fy, fr * 2, { stroke: tp.accent, strokeWidth: 5, roughness: 1.5, seed: K.seed });
}

// ---------- scenes ----------
function heading(K, a, b) {
  ctx.textAlign = 'center'; ctx.font = '700 96px Caveat'; ctx.fillStyle = K.tp.ink; ctx.fillText(a, 540, 150);
  if (b) { ctx.font = '700 66px Caveat'; ctx.fillStyle = K.tp.accent; ctx.fillText(b, 540, 222); }
}
function question(K, x, y, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(0.15 * Math.sin(t * 3));
  ctx.font = '700 120px Caveat'; ctx.fillStyle = K.tp.accent; ctx.textAlign = 'center'; ctx.fillText('?', 0, 0); ctx.restore();
}
function sceneBoth(K, t, title, sub, extras) {
  heading(K, title, sub);
  D.preacher(K, rep(t), 430, 930, 430);
  D.cableCurl(K, rep(t + 0.6), 600, 1660, 400);
  if (extras) extras();
}
function sceneBig(K, t, which) {
  const c = rep(t);
  if (which === 'short') { heading(K, 'Arm in front', 'on the preacher pad'); D.preacher(K, c, 470, 1500, 640); }
  else { heading(K, 'Arm behind', 'cable curl, facing away'); D.cableCurl(K, c, 640, 1560, 560); }
}
function sceneZoom(K, t, focus, appear, note) {
  heading(K, focus === 'short' ? 'Arm in front' : 'Arm behind', focus === 'short' ? '= SHORT head works' : '= LONG head works');
  const c = rep(t);
  const mini = focus === 'short' ? D.preacher(K, c, 300, 1720, 300) : D.cableCurl(K, c, 420, 1730, 270);
  const k = 0.2 + 0.8 * ease(appear), r = 400 * k, lens = [570, 840, r];
  magnifier(K, ...lens, [mini.muscle[0], mini.muscle[1], 46]);
  ctx.save(); ctx.beginPath(); ctx.arc(lens[0], lens[1], r - 4, 0, 7); ctx.clip();
  const sc = 0.95 * k;
  const pts = armCloseup(K, lens[0] + 20 * sc, lens[1] + 20 * sc, sc, focus, 0.5 + 0.5 * c);
  ctx.restore();
  K.rc.circle(lens[0], lens[1], r * 2, { stroke: K.tp.ink, strokeWidth: 9, roughness: 1.4, seed: K.seed });
  if (appear < 0.95) return;
  const on = K.tp.accent, off = 'rgba(26,26,26,0.55)';
  const label = (text, x, y, to, col, big) => {
    ctx.font = (big ? '700 64px' : '700 48px') + ' Caveat'; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.fillText(text, x, y);
    const fx = x + (to[0] - x) * 0.18, fy = y + 18 + (to[1] - y) * 0.05;
    K.rc.line(fx, fy, to[0], to[1], { stroke: col, strokeWidth: big ? 6 : 4, roughness: 1, seed: K.seed });
    const a = Math.atan2(to[1] - fy, to[0] - fx);
    for (const da of [2.6, -2.6]) K.rc.line(to[0], to[1], to[0] + 26 * Math.cos(a + da), to[1] + 26 * Math.sin(a + da), { stroke: col, strokeWidth: big ? 6 : 4, roughness: 0.6, seed: K.seed });
  };
  label(focus === 'short' ? 'SHORT HEAD' : 'short head', 190, 470, pts.shortAt, focus === 'short' ? on : off, focus === 'short');
  label(focus === 'long' ? 'LONG HEAD' : 'long head', 900, 1310, pts.longAt, focus === 'long' ? on : off, focus === 'long');
  if (note) {   // circle the shoulder: the long head crosses it
    const p = pts.shoulder;
    K.rc.ellipse(p[0], p[1] - 20, 280, 190, { stroke: K.tp.accent, strokeWidth: 7, roughness: 2, seed: K.seed });
    ctx.font = '700 60px Caveat'; ctx.fillStyle = K.tp.accent; ctx.textAlign = 'center'; ctx.fillText('crosses the shoulder!', 760, 320);
  }
}

// ---------- captions ----------
function chunks() {
  const out = [];
  for (const ln of VO) {
    const words = ln.text.split(' '), cs = []; let cur = [];
    words.forEach((w, i) => { cur.push(w); if (/[.,!?]$/.test(w) || cur.length >= 4 || i === words.length - 1) { cs.push(cur.join(' ')); cur = []; } });
    let acc = 0; const total = ln.text.length, st = SEG[ln.id].vo;
    for (const c of cs) { const t0 = st + ln.dur * acc / total; acc += c.length + 1; out.push({ text: c, t0, t1: st + ln.dur * Math.min(1, acc / total) }); }
  }
  return out;
}
const CH = chunks();
const RED = /^(short|long|biceps|shoulder|front|behind|stretched|slack)/i;
function caption(t) {
  const c = CH.find((c, i) => t >= c.t0 && t < (CH[i + 1] && CH[i + 1].t0 - c.t1 < 0.6 ? CH[i + 1].t0 : c.t1 + 0.35));
  if (!c) return;
  const words = c.text.split(' ');
  ctx.font = '700 80px Caveat';
  const sp = ctx.measureText(' ').width, w = words.reduce((s, x) => s + ctx.measureText(x).width, 0) + sp * (words.length - 1);
  ctx.fillStyle = 'rgba(244,241,234,0.88)'; ctx.fillRect(540 - w / 2 - 30, 1792, w + 60, 100);
  let x = 540 - w / 2; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (const word of words) { ctx.fillStyle = RED.test(word) ? '#d7261e' : '#1a1a1a'; ctx.fillText(word, x, 1842); x += ctx.measureText(word).width + sp; }
  ctx.textBaseline = 'alphabetic';
}

window.drawFrame = function (t) {
  ctx.drawImage(D.background('paper'), 0, 0);
  const seed = 1 + Math.floor(t * 8);
  const K = D.kit(ctx, 'paper', seed); K.seed = seed;
  const { id, s, u } = segAt(t), lt = t - s.start, L = s.end - s.start, split = 0.42;
  if (id === 'hook') sceneBoth(K, t, 'Same curl.', 'Two heads?', () => { question(K, 720, 340, t); question(K, 860, 1120, t + 1); });
  else if (id === 'a' || id === 'b') {
    const focus = id === 'a' ? 'short' : 'long';
    if (u < split) sceneBig(K, t, focus);
    else sceneZoom(K, t, focus, fade(lt, L * split, L * split + 0.5));
  }
  else if (id === 'why') sceneZoom(K, t, 'long', 1, true);
  else sceneBoth(K, t, 'Front + behind', '= the whole biceps', () => {
    ctx.save(); ctx.translate(830, 1300); ctx.rotate(-0.12);
    K.rc.rectangle(-170, -70, 340, 120, { stroke: K.tp.accent, strokeWidth: 6, roughness: 2, seed });
    ctx.font = '700 72px Caveat'; ctx.fillStyle = K.tp.accent; ctx.textAlign = 'center'; ctx.fillText('Save this!', 0, 18); ctx.restore();
  });
  // quick paper flash at each scene change
  const since = (id === 'a' || id === 'b') && lt >= L * split ? lt - L * split : lt;
  if (t > 0.2 && since < 0.12) { ctx.fillStyle = `rgba(244,241,234,${1 - since / 0.12})`; ctx.fillRect(0, 0, W, H); }
  caption(t);
  return cv.toDataURL('image/png');
};
document.fonts.load('700 40px Caveat').then(() => document.fonts.load('40px "Patrick Hand"')).then(() => { window.ready = true; });
</script></body></html>
