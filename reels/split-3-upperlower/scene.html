<body><canvas id="c" width="1080" height="1920"></canvas>

<script>window.TIMING = { pre: 0.15, post: 0.3 };</script>

<script src="../lib/splitkit.js"></script>
<script>
const WEEK = ['UPPER', 'LOWER', 'REST', 'UPPER', 'LOWER', 'REST', 'REST'];
const UP = { chest: COL.UPPER, shoulders: COL.UPPER, arms: COL.UPPER, back: COL.UPPER }, LO = { legs: COL.LOWER, glutes: COL.LOWER, core: COL.LOWER };
SplitRun({
  ep: 3, key: /^(four|upper|lower|chest|back|shoulders|arms|legs|glutes|core|twice)/i,
  hook: [['4 DAYS', 160], ['A WEEK?', 150]],
  titles: { what: ['Upper / Lower', 'your body in two'], week: ['The week', null], pros: ['The good', null], out: ['Upper / Lower', null] },
  scenes: {
    hook: (t, st, c) => { calendar(540, 760, WEEK, 0, 128, 300, [0, 1, 3, 4]); man({ x: 540, y: 1680, s: 380 }, { face: 'confused', arms: { L: [40, 100], R: [40, 100] } }); },
    what: (t, st, c) => { bodyMap({ x: 290, y: 1500, s: 440 }, UP, 'UPPER', COL.UPPER); if (st.u > 0.45) bodyMap({ x: 790, y: 1500, s: 440 }, LO, 'LOWER', COL.LOWER); },
    week: (t, st, c) => calendar(540, 620, WEEK, st.u * 1.7),
    pros: (t, st, c) => { calendar(540, 420, WEEK, 1, 128, 240, [0, 3]); bodyMap({ x: 330, y: 1650, s: 420 }, UP); sticky(570, 900, 430, 360, 0.04, [['2× / week', 72, RED], ['per muscle', 56], ['more time', 56], ['per muscle', 56]], fade(st.u, 0.1, 0.25)); },
    out: (t, st, c) => nextCard('Ep 4: Push / Pull / Legs', st.u),
  },
});
</script></body></html>
